name: Verify EHS modules
on:
  push:
    branches: [feature/ehs-modules]
permissions:
  contents: read
jobs:
  compile-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile web UI
        run: |
          chmod +x gradlew
          SKIP_ANDROID=true ./gradlew :web:compileKotlinJs --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g"
