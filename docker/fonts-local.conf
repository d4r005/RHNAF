<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Los documentos controlados de la planta combinan chino con texto en
  español usando SimSun (宋体). Sin SimSun, LibreOffice sustituye con
  DejaVu Serif, cuya letra latina es mucho más ancha y rompía el
  encabezado (el nombre de la empresa se partía en dos renglones).
  Con este alias el latino usa Liberation Serif (métrica de Times,
  parecida al latino compacto de SimSun) y los caracteres chinos caen
  por glifo a Noto CJK, que ya está instalada.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <!-- Aptos/Aptos Display: tipo nuevo de Office; sin sustituto cae a DejaVu
       (ancha) y el texto se sale de los gafetes. Carlito = metrica Calibri. -->
  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <!-- Tahoma y las negritas CJK: metrica cercana con Liberation Sans (angosta,
       que es la direccion segura en formatos al limite como los gafetes). -->
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
